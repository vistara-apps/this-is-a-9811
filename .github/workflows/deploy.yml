name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096

    - name: Run tests
      run: npm test
      env:
        CI: true
        
    - name: Check if Vercel secrets are available
      id: check-secrets
      run: |
        if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
          echo "vercel-available=true" >> $GITHUB_OUTPUT
        else
          echo "vercel-available=false" >> $GITHUB_OUTPUT
          echo "⚠️ Vercel secrets not configured - skipping deployment"
        fi
        
    - name: Deploy to Vercel (Production)
      if: steps.check-secrets.outputs.vercel-available == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        
    - name: Deploy to Vercel (Preview)
      if: steps.check-secrets.outputs.vercel-available == 'true' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-args: '--no-wait'
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        github-comment: true
        github-deployment: false
        
    - name: Comment PR with build status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const vercelAvailable = '${{ steps.check-secrets.outputs.vercel-available }}' === 'true';
          let message = '✅ **Build Successful!**\n\n';
          message += '🔨 **Build Status:** Passed\n';
          message += '🧪 **Tests:** Passed\n';
          message += '📝 **Linting:** Passed\n\n';
          
          if (vercelAvailable) {
            message += '🚀 **Deployment:** Vercel deployment in progress\n';
            message += 'Check the Actions tab for deployment status.';
          } else {
            message += '📦 **Deployment:** Build artifacts ready\n';
            message += '💡 **Note:** Vercel deployment skipped (secrets not configured)';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: message
          });
